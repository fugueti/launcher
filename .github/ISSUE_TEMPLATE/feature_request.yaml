name: Feature request
description: An idea to make Fugueti better.
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first; if it is already there, add a
        👍 to it instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Describe the feature. Screenshots, drawings or examples from other apps help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: input
    id: version
    attributes:
      label: Fugueti version
      placeholder: 16.0.1
