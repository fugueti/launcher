name: Bug report
description: Something in Fugueti does not work as it should.
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Opening this from *Settings → About → Support → Report a bug* fills in
        the version and device fields for you. Please search the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: Fugueti version
      description: Settings → About (long press the version to see the commit).
      placeholder: 16.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Google Pixel 9
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 17 (API 37)
    validations:
      required: true
  - type: dropdown
    id: feed
    attributes:
      label: Fugueti Feed (Google Discover)
      options:
        - Not installed
        - Installed
    validations:
      required: false
  - type: checkboxes
    id: upstream
    attributes:
      label: Lawnchair
      options:
        - label: The same problem also happens in Lawnchair
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For crashes, `adb logcat -d -b crash` helps a lot. Screenshots and recordings are welcome.
      render: text
