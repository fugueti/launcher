# Categories for GitHub's generated release notes (labels on merged pull requests).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ✨ Features
      labels: [enhancement, feature]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 🧹 Housekeeping
      labels: [chore, dependencies, documentation, ci]
    - title: Other changes
      labels: ['*']
