name: CI

# Pull requests to main: unit tests. Nothing builds on push to main: Android 16 releases come
# from version tags (release.yml). The nightly is built from 17-dev (nightly.yml on that branch).

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'art/**', 'LICENSE.txt', 'COPYING']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.fugueti.*'
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
