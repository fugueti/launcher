name: CI

# Pull requests and pushes to main or a *-dev branch (e.g. 17-dev): unit tests.
# Pushes to main also build the signed nightly, which replaces the "nightly" release
# (the in-app updater of app.fugueti.launcher.nightly reads that release).

on:
  pull_request:
    branches: [main, '*-dev']
    paths-ignore: ['**.md', 'docs/**', 'art/**', 'LICENSE.txt', 'COPYING']
  push:
    branches: [main, '*-dev']
    paths-ignore: ['**.md', 'docs/**', 'art/**', 'LICENSE.txt', 'COPYING']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.fugueti.*'
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

  nightly:
    needs: test
    # Only main publishes nightlies: the in-app updater follows main's "nightly" release.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build nightly APK
        run: ./gradlew assembleLawnWithQuickstepNightlyRelease
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater reads the CI number between "_" and "-" of the asset name.
          APK="Fugueti.Nightly-CI_${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          mv build/outputs/apk/lawnWithQuickstepNightly/release/*.apk "$APK"
          NOTES="Nightly build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Development build of the next version. Installs next to the release app (app.fugueti.launcher.nightly, dark icon) and updates itself from this release."
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly "$APK" --repo "$GITHUB_REPOSITORY" --target main \
            --prerelease --title "Fugueti Nightly" --notes "$NOTES"
