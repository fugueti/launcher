name: Nightly

# Builds the signed nightly from 17-dev (Launcher3 from Android 17) on every push and replaces the
# "nightly" release, which the in-app updater of app.fugueti.launcher.nightly reads.
# Needs repository secrets: KEYSTORE_BASE64 (base64 of the .jks), STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  push:
    branches: [17-dev]
    paths-ignore: ['**.md', 'docs/**', 'art/**', 'LICENSE.txt', 'COPYING']
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/17-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.fugueti.*'
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build nightly APK
        run: ./gradlew assembleLawnWithQuickstepNightlyRelease
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater reads the build number between "_" and "-" of the asset name and
          # only accepts a release whose target is its own branch (NightlyBuildsRepository).
          APK="Fugueti.Nightly-CI_${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          mv build/outputs/apk/lawnWithQuickstepNightly/release/*.apk "$APK"
          NOTES="Nightly build #${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): $(git log -1 --format=%s)

          Development build of Fugueti on Launcher3 from Android 17. Installs next to the stable app (app.fugueti.launcher.nightly, dark icon) and updates itself from this release."
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" \
            --prerelease --title "Fugueti Nightly (Android 17)" --notes "$NOTES"
